name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_BASE_IMAGE: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated network canaries and full test suite
        id: isolated-tests
        run: |
          python scripts/ci_network_isolation.py \
            --python-version 3.12 \
            --base-image "$PYTHON_BASE_IMAGE" \
            --expected-revision "$GITHUB_SHA" \
            --report-dir "$RUNNER_TEMP/kybernaut-ci-artifacts"
      - name: Validate JUnit report redaction
        id: validate-junit
        if: always()
        env:
          JUNIT_REPORT: ${{ runner.temp }}/kybernaut-ci-artifacts/junit/results.xml
          KYBERNAUT_JWT_SECRET: ci-junit-validation-sentinel-secret
        run: python scripts/validate_junit_report.py "$JUNIT_REPORT"
      - name: Validate network isolation evidence
        id: validate-isolation
        if: always()
        env:
          ISOLATION_EVIDENCE: ${{ runner.temp }}/kybernaut-ci-artifacts/network-isolation.json
          JUNIT_REPORT: ${{ runner.temp }}/kybernaut-ci-artifacts/junit/results.xml
        run: python scripts/validate_network_isolation_evidence.py "$ISOLATION_EVIDENCE" "$JUNIT_REPORT"
      - name: Install YAML validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Upload JUnit report
        if: ${{ always() && steps.validate-junit.outcome == 'success' && steps.validate-isolation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: |
            ${{ runner.temp }}/kybernaut-ci-artifacts/junit/results.xml
            ${{ runner.temp }}/kybernaut-ci-artifacts/network-isolation.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate YAML configs and manifests
        run: |
          python - <<'PY'
          import glob, yaml
          files = glob.glob("k8s/**/*.yaml", recursive=True) + \
                  glob.glob("monitoring/**/*.yml", recursive=True) + \
                  glob.glob("docker-compose*.yml") + \
                  glob.glob(".github/workflows/*.yml")
          for f in files:
              list(yaml.safe_load_all(open(f)))
              print("ok", f)
          PY
