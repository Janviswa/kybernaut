services:
  order-service:
    build:
      context: ./target_apps
      dockerfile: order_service/Dockerfile
    container_name: kybernaut-order-service
    environment:
      KYBERNAUT_ENVIRONMENT: "${KYBERNAUT_ENVIRONMENT:-local-demo}"
      KYBERNAUT_FAILURE_SIMULATION_TOKEN: "${KYBERNAUT_FAILURE_SIMULATION_TOKEN:-}"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1516"
        syslog-format: rfc5424micro
        tag: kybernaut-order
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  payment-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kybernaut_payments
      POSTGRES_USER: kybernaut_payment
      POSTGRES_PASSWORD: "${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PAYMENT_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kybernaut_payment -d kybernaut_payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  payment-service:
    build:
      context: ./target_apps
      dockerfile: payment_service/Dockerfile
    container_name: kybernaut-payment-service
    environment:
      KYBERNAUT_ENVIRONMENT: "${KYBERNAUT_ENVIRONMENT:-local-demo}"
      KYBERNAUT_FAILURE_SIMULATION_TOKEN: "${KYBERNAUT_FAILURE_SIMULATION_TOKEN:-}"
      PAYMENT_DB_HOST: payment-postgres
      PAYMENT_DB_PORT: "5432"
      PAYMENT_DB_NAME: kybernaut_payments
      PAYMENT_DB_USER: kybernaut_payment
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      alloy:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1516"
        syslog-format: rfc5424micro
        tag: kybernaut-payment
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  user-service:
    build:
      context: ./target_apps
      dockerfile: user_service/Dockerfile
    container_name: kybernaut-user-service
    environment:
      KYBERNAUT_ENVIRONMENT: "${KYBERNAUT_ENVIRONMENT:-local-demo}"
      KYBERNAUT_FAILURE_SIMULATION_TOKEN: "${KYBERNAUT_FAILURE_SIMULATION_TOKEN:-}"
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1516"
        syslog-format: rfc5424micro
        tag: kybernaut-user
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8003/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  inventory-service:
    build:
      context: ./target_apps
      dockerfile: inventory_service/Dockerfile
    container_name: kybernaut-inventory-service
    environment:
      KYBERNAUT_ENVIRONMENT: "${KYBERNAUT_ENVIRONMENT:-local-demo}"
      KYBERNAUT_FAILURE_SIMULATION_TOKEN: "${KYBERNAUT_FAILURE_SIMULATION_TOKEN:-}"
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      alloy:
        condition: service_healthy
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1516"
        syslog-format: rfc5424micro
        tag: kybernaut-inventory
        mode: non-blocking
        max-buffer-size: 4m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8004/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: kybernaut-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:9090/-/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    container_name: kybernaut-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: kybernaut-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3100/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.1
    container_name: kybernaut-alloy
    command:
      - run
      - --storage.path=/tmp/alloy-data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      - "127.0.0.1:1516:1515/tcp"
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345; printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3;
          IFS= read -r status <&3; [[ "$$status" == *200* ]]'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  payment-postgres-data:

networks:
  default:
    driver: bridge
